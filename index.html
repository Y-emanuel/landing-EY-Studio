<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />

    <title>EY Studio | Diseño Web Premium para negocios de Argentina y LATAM</title>
    <meta
      name="description"
      content="EY Studio diseña y desarrolla landing pages, sitios web, tiendas online y experiencias digitales para negocios de Argentina y LATAM."
    />

    <!-- Reemplazá esta URL por tu dominio real una vez que publiques el sitio -->
    <link rel="canonical" href="https://eystudio.com.ar/" />

    <!-- Open Graph (previsualización al compartir en WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EY Studio" />
    <meta property="og:title" content="EY Studio | Diseño Web Premium" />
    <meta
      property="og:description"
      content="Páginas web premium para negocios que quieren vender más. Diseño, desarrollo y contacto directo por WhatsApp."
    />
    <meta property="og:url" content="https://eystudio.com.ar/" />
    <!-- Reemplazá por una imagen 1200x630px subida a /public, ej: /og-image.jpg -->
    <meta property="og:image" content="https://eystudio.com.ar/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EY Studio | Diseño Web Premium" />
    <meta
      name="twitter:description"
      content="Páginas web premium para negocios que quieren vender más. Diseño, desarrollo y contacto directo por WhatsApp."
    />
    <meta name="twitter:image" content="https://eystudio.com.ar/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
